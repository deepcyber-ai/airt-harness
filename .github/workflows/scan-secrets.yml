# Public-repo CI: run the EXPORT-policy scan over the whole tree.
# Shipped by build_export into the clean output repo's .github/workflows/. It is
# NOT placed in the WIP repo's active workflows, because WIP intentionally retains
# research content that the export policy forbids (see the WIP credentials workflow).
name: scan-secrets
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Secret / forbidden-content scan (export policy)
        run: python3 scripts/scan_secrets.py --policy export --root . .
